[car_link]
# TeslaUSB paths: leave these unchanged unless the installed image differs.
archive_root = /mutable/TeslaCam
snapshot_root = /backingfiles/snapshots
snapshot_mount_root = /tmp/snapshots

# Must be on the Pi's SSD, not its read-only root filesystem.
spool_root = /backingfiles/car-link-spool
require_mountpoint = /backingfiles
upload_marker = /run/teslausb-car-link/upload-active

# Dedicated, restricted account on the home intake host. Use its WireGuard IP.
ssh_user = REPLACE_WITH_INTAKE_USER
ssh_host = REPLACE_WITH_INTAKE_WG_IP
# rrsync -wo -no-del restricts this key to the staging root; '.' means that root.
ssh_path = .
ssh_key = /etc/teslausb-car-link/intake_ed25519
vpn_interface = REPLACE_WITH_WG_INTERFACE

# Test the snapshot cadence on the car before expecting this deadline.
min_file_age_seconds = 30
stable_mp4_snapshots = 2
bandwidth_kib_per_second = 750
active_bandwidth_kib_per_second = 250
max_files_per_send = 100
sent_retention_days = 0
max_spool_gib = 5
metadata_reserve_mib = 256
min_free_gib = 45

[policy]
meter_file = /backingfiles/car-link-meter.json
ssd_mountpoint = /backingfiles
net_root = /sys/class/net
lte_driver = rndis_host
soft_cap_gb = 40
hard_cap_gb = 60
home_archive_host = REPLACE_WITH_HOME_NAS_LAN_IP
home_archive_port = 445
power_log = /mutable/car-link-power.log
video_service = car-video.service
max_session_min = 30
max_handshake_age_seconds = 180
intake_wg_ip = REPLACE_WITH_INTAKE_WG_IP
sunshine_wg_ip = REPLACE_WITH_SUNSHINE_WG_IP
wg_endpoint_ip = REPLACE_WITH_PUBLIC_ENDPOINT_IP
vpn_interface = REPLACE_WITH_WG_INTERFACE
heartbeat_url = http://REPLACE_WITH_INTAKE_WG_IP:REPLACE_WITH_HEARTBEAT_PORT/hb
# Leave off until the home service has a verified Park signal.
remote_video_on_enabled = false
ntp_marker = /run/teslausb-car-link/ntp-synced

[gadget_guard]
udc_file = /sys/kernel/config/usb_gadget/teslausb/UDC
udc_root = /sys/class/udc
state_file = /mutable/gadget-guard-state.json
log_file = /mutable/gadget-guard.log
disable_cmd = /root/bin/disable_gadget.sh
enable_cmd = /root/bin/enable_gadget.sh
interval_seconds = 30
max_replugs_per_hour = 3
settle_seconds = 3
verify_seconds = 10
