<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeslaUSB Moonlight</title>
<style>
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:#f6f7f9; color:#202329; font:16px Arial,Helvetica,sans-serif; }
main { max-width:620px; margin:auto; }
h1 { font-size:1.5rem; margin:0 0 18px; }
.card { padding:22px; background:white; border:1px solid #d9dee5; border-radius:10px; }
#state { font-size:1.25rem; font-weight:600; margin:0 0 8px; }
#session { color:#626a76; min-height:1.3em; }
label { display:flex; align-items:center; gap:10px; margin:25px 0 18px; }
input { width:20px; height:20px; }
.buttons { display:flex; gap:12px; flex-wrap:wrap; }
button { font:inherit; padding:12px 20px; border-radius:7px; border:1px solid #bfc7d1; cursor:pointer; background:white; }
#start { background:#c40000; color:white; border-color:#c40000; }
button:disabled { opacity:.45; cursor:default; }
#message { min-height:1.4em; margin:20px 0 0; }
#message.error { color:#a40000; }
.note { color:#626a76; line-height:1.5; margin:18px 0 0; }
nav { margin-top:20px; } nav a { color:#626a76; margin-right:18px; }
</style>
</head>
<body>
<main>
<h1>Moonlight</h1>
<section class="card">
  <p id="state" role="status">Checking video…</p>
  <div id="session"></div>
  <label><input type="checkbox" id="parked">The car is parked</label>
  <div class="buttons">
    <button id="start" type="button" disabled>Start Moonlight</button>
    <button id="stop" type="button">Stop Moonlight</button>
  </div>
  <p id="message" role="status" aria-live="polite"></p>
  <p class="note">Video appears on the car's HDMI input. The session time limit, data cap, and power checks still apply.</p>
</section>
<nav><a href="/">TeslaUSB</a><a href="/new/">Alternative view</a><a href="/wifi/">Wi-Fi</a></nav>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
let active=false, busy=false;
function buttons() { $('start').disabled=busy || active || !$('parked').checked; $('stop').disabled=busy; }
function render(data) {
  active=data.active;
  $('state').textContent=active ? 'Moonlight is running' : 'Moonlight is stopped';
  $('session').textContent=active && data.remaining_seconds!==null ?
    Math.ceil(data.remaining_seconds/60)+' minutes remaining' :
    'Automatic stop after '+data.max_session_minutes+' minutes';
  buttons();
}
async function api(action, body) {
  const options=body===undefined ? {cache:'no-store'} : {
    method:'POST', cache:'no-store', headers:{'Content-Type':'application/json','X-Car-Wifi-Action':'1'}, body:JSON.stringify(body)
  };
  const response=await fetch('/cgi-bin/car-wifi.cgi?action='+action,options);
  const data=await response.json();
  if(!response.ok || !data.ok) throw new Error(data.error || 'Video control is unavailable');
  return data;
}
async function refresh() { try { render(await api('video-status')); } catch(error) { show(error.message,true); } }
function show(text,error=false) { $('message').textContent=text; $('message').classList.toggle('error',error); }
async function control(action) {
  busy=true; buttons(); show(action==='video-start' ? 'Starting Moonlight…' : 'Stopping Moonlight…');
  try { render(await api(action,{parked:$('parked').checked})); show(active ? 'Moonlight started.' : 'Moonlight stopped.'); }
  catch(error) { show(error.message,true); }
  finally { busy=false; buttons(); }
}
$('parked').addEventListener('change',buttons);
$('start').addEventListener('click',()=>control('video-start'));
$('stop').addEventListener('click',()=>control('video-stop'));
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
